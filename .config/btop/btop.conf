#? Config for btop (akim-dotfiles). btop adds every other option with its default when it saves.

#* Theme from the current wallpaper: ~/.config/btop/themes/pywal.theme, rewritten on every
#* wallpaper switch by ~/.config/hypr/scripts/apply-pywal-theme.sh
color_theme = "pywal"

#* No background: kitty's transparency and blur show through
theme_background = false
truecolor = true

#* Rounded boxes, fine braille graphs ("block" for bold blocks, "tty" for plain characters)
rounded_corners = true
graph_symbol = "braille"

#* Boxes shown: cpu, mem, net, proc (press 1-4 to toggle them)
shown_boxes = "cpu mem net proc"
update_ms = 1500
proc_sorting = "cpu lazy"
proc_gradient = true
proc_colors = true
mem_graphs = true
show_disks = true
