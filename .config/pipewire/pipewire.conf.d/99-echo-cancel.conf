# WebRTC Acoustic Echo Cancellation & Noise Suppression for PipeWire
# Automatically cancels speaker audio bleed and suppresses laptop case fan noise.
context.modules = [
    {
        name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            aec.args = "high_pass_filter=1 noise_suppression=1 extended_filter=1 voice_detection=1"
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Echo-Canceling Microphone (Noise & Fan Filtered)"
            }
        }
    }
]
