## My kitty conf

# Theme
include ~/.cache/wal/colors-kitty.conf

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Windows & Transparency
window_padding_width 14
background_opacity   0.65
dynamic_background_opacity yes
confirm_os_window_close 0

enable_audio_bell no

# Cursor: thin beam in the wallpaper's accent (colors-kitty.conf) that fades in and out, and
# smears toward its new spot when it jumps (Enter, word jumps, clicks). The trail needs kitty 0.37+.
cursor_shape                 beam
cursor_beam_thickness        2
cursor_blink_interval        0.6 ease-in-out
cursor_stop_blinking_after   0
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2
allow_remote_control yes

