# https://wiki.hyprland.org/Hypr-Ecosystem/hyprpaper/

splash = false
ipc = on

# current.jpg is a symlink to the source file (no re-encoding).
# Use high-resolution images; fit_mode cover scales without stretching.
preload = ~/Pictures/wallpapers/current.jpg

wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/current.jpg
    fit_mode = cover
}
