# https://wiki.hyprland.org/Hypr-Ecosystem/hyprpaper/

splash = false
ipc = on

# Preload at native resolution (avoids blur from low-res buffers)
preload = ~/Pictures/wallpapers/current.jpg

# cover = sharp fill of the screen (may crop edges). Avoid "fill" which stretches and blurs.
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/current.jpg
    fit_mode = cover
}
