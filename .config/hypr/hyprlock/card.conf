# Glass card: bold clock on the left, frosted card with avatar, greeting and password on the right
source = ~/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $real_wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.78
    contrast = 1.0
    vibrancy = 0.1
}

# Clock: hours over minutes
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $foreground
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 160, 150
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $foreground
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 160, -10
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lockinfo.sh datebat
    color = rgba(255, 255, 255, 0.75)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 166, -140
    halign = left
    valign = center
}

# Frosted card (centered 520px right of the screen center)
shape {
    monitor =
    size = 460, 480
    color = rgba(150, 165, 185, 0.22)
    rounding = 28
    border_size = 1
    border_color = rgba(255, 255, 255, 0.18)
    position = 520, 0
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/Pictures/akim-avatar.png
    size = 120
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)
    position = 520, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lockinfo.sh greeting
    color = $foreground
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold
    position = 520, 15
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 52
    rounding = -1
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0.25)
    font_color = $foreground
    check_color = $color2
    fail_color = $color9
    capslock_color = $color3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##ffffffaa">Password</span>
    fail_text = <i>$FAIL</i>
    position = 520, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/scripts/lockinfo.sh caps
    color = rgba(255, 255, 255, 0.7)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 520, -140
    halign = center
    valign = center
}

# Now playing (bottom left)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lockinfo.sh song
    color = rgba(255, 255, 255, 0.78)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 160, 60
    halign = left
    valign = bottom
}
