# Clock first: large thin clock and date, avatar + password below, live status along the bottom
source = ~/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $real_wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.72
    contrast = 1.0
    vibrancy = 0.1
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    font_size = 120
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 290
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# Date
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lockinfo.sh date
    color = rgba(255, 255, 255, 0.72)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 170
    halign = center
    valign = center
}

# Avatar and name
image {
    monitor =
    # Your picture (~/.face is also what GDM shows); the installer puts one there
    path = ~/.face
    size = 96
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $foreground
    font_size = 15
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -120
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 340, 52
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.22)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = $foreground
    check_color = $color2
    fail_color = $color9
    capslock_color = $color3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##ffffffaa">󰌾   Password</span>
    fail_text = <i>$FAIL</i>
    position = 0, -195
    halign = center
    valign = center
}

# Now playing (bottom left) and Wi-Fi / battery / layout (bottom right)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lockinfo.sh song
    color = rgba(255, 255, 255, 0.78)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 40, 34
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/lockinfo.sh status
    color = rgba(255, 255, 255, 0.78)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -40, 34
    halign = right
    valign = bottom
}
