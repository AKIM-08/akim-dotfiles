# Minimal: the time, the date and an underlined password field, nothing else
source = ~/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $real_wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.85
    contrast = 1.0
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    font_size = 96
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lockinfo.sh date
    color = rgba(255, 255, 255, 0.72)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -15
    halign = center
    valign = center
}

# Transparent field with a thin line under it
input-field {
    monitor =
    size = 260, 44
    rounding = 0
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0)
    font_color = $foreground
    check_color = $color2
    fail_color = $color9
    capslock_color = $color3
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##ffffff88">password</span>
    fail_text = <i>$FAIL</i>
    position = 0, -90
    halign = center
    valign = center
}

shape {
    monitor =
    size = 260, 1
    color = rgba(255, 255, 255, 0.45)
    position = 0, -114
    halign = center
    valign = center
}
